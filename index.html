<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Octorogue Traveler</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0c10;
        overflow: hidden;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <!-- Ne pas ajouter de <script> manuel ici : HtmlWebpackPlugin injecte
         automatiquement le bundle compilé (voir webpack.config.js). Un tag
         <script src="bundle.js"> en double faisait s'exécuter src/index.ts
         deux fois, créant deux instances de Phaser.Game côte à côte dans
         #game-container. -->
  </body>
</html>
